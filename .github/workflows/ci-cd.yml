name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Job 1: Lint + Test ────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  # ── Job 2: Build ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: NODE_ENV=production npm run build

  # ── Job 3: Deploy (only on push to master/main) ───────────────────────────────
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env.prod on VM
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            mkdir -p ${{ secrets.VM_DEPLOY_DIR }}
            cat > ${{ secrets.VM_DEPLOY_DIR }}/.env.prod << 'ENVEOF'
          MONGODB_URI=${{ secrets.PROD_MONGODB_URI }}
          MONGODB_DB=videovault
          RUSTFS_ENDPOINT=${{ secrets.PROD_RUSTFS_ENDPOINT }}
          RUSTFS_ACCESS_KEY=${{ secrets.PROD_RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY=${{ secrets.PROD_RUSTFS_SECRET_KEY }}
          RUSTFS_BUCKET=videos
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          NODE_ENV=production
          ENVEOF
          "

      - name: Sync project files to VM
        run: |
          rsync -avz --progress \
            --exclude '.next/' \
            --exclude 'node_modules/' \
            --exclude '.env*' \
            --exclude 'coverage/' \
            --exclude '.git/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ secrets.VM_DEPLOY_DIR }}/

      - name: Build and deploy Docker container on VM
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ${{ secrets.VM_DEPLOY_DIR }}
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
          "

      - name: Health check
        run: |
          sleep 15
          curl -f https://videovault.deviaaps.com/api/auth/me || echo "Health check pending (app starting up)"
